<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamster Kombat</title>
<style>
:root{--bg:#272a2f;--card:#33363c;--text:#fff;--orange:#f5a33a;--violet:#8b8cff;--green:#7ee06f;--muted:#8a8d94;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#272a2f;--card:#33363c;--text:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",system-ui,sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
h1{font-size:15px;font-weight:500;text-align:center;margin:28px 0 24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:10px;padding:8px 6px;text-align:center;font-size:11px}
.stat b{display:flex;justify-content:center;align-items:center;gap:4px;font-size:13px;font-weight:500;margin-top:6px}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#f0a81c);box-shadow:inset 0 0 0 2px #f7c948}
.balance{display:flex;justify-content:center;align-items:center;gap:12px;margin:34px 0 0;font-size:40px;font-weight:700}
.balance .coin{width:38px;height:38px;box-shadow:inset 0 0 0 4px #f7c948}
.stage{flex:1;display:flex;justify-content:center;align-items:center;min-height:0;position:relative}
#tap{width:min(78vw,320px);aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;background:none;display:block;transition:transform .08s ease-out;touch-action:manipulation}
#tap img{width:100%;height:100%;display:block;border-radius:50%;pointer-events:none}
#tap:focus-visible{outline:3px solid #fff;outline-offset:6px}
.float{position:fixed;font-size:26px;font-weight:700;pointer-events:none;animation:up .8s ease-out forwards;text-shadow:0 2px 4px rgba(0,0,0,.4)}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}
.energy{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500;margin:10px 4px 14px}
.energy div{display:flex;align-items:center;gap:8px}
.energy svg{width:26px;height:26px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-radius:14px;padding:6px;font-size:10px;text-align:center;color:var(--muted)}
.nav div{padding:8px 0;border-radius:8px}
.nav div.on{background:#1f2125;color:#fff;font-weight:500}
.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){.float{animation-duration:.01s}#tap{transition:none}}
</style>
</head>

    <div><svg viewBox="0 0 24 24" fill="#f5a33a"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><span id="en">6500 / 6500</span></div>
    <span>Boost</span>
  </div>

    <div class="on"><i>◆</i>Exchange</div><div><i>⛏</i>Mine</div><div><i>👥</i>Friends</div><div><i>🪙</i>Earn</div><div><i>🟠</i>Airdrop</div>
  </div>
</div>
<script>
(function(){
  var PER=12,MAX=6500,balance=0,energy=MAX;
  var bal=document.getElementById('bal'),en=document.getElementById('en'),btn=document.getElementById('tap');
  try{var s=localStorage.getItem('hk2');if(s){var d=JSON.parse(s);if(d&&d.b>=0){balance=d.b;energy=Math.min(MAX,d.e)}}}catch(e){}
  function fmt(n){return n.toLocaleString('en-US')}
  function render(){bal.textContent=fmt(balance);en.textContent=Math.floor(energy)+' / '+MAX}
  function save(){try{localStorage.setItem('hk2',JSON.stringify({b:balance,e:energy}))}catch(e){}}
  function tap(x,y,cx,cy){
    if(energy<PER)return;
    energy-=PER;balance+=PER;render();
    var r=btn.getBoundingClientRect(),dx=(x-(r.left+r.width/2))/(r.width/2),dy=(y-(r.top+r.height/2))/(r.height/2);
    btn.style.transform='perspective(500px) rotateY('+(dx*12)+'deg) rotateX('+(-dy*12)+'deg) scale(.96)';
    setTimeout(function(){btn.style.transform=''},90);
    var f=document.createElement('div');f.className='float';f.textContent='+'+PER;
    f.style.left=(x-12)+'px';f.style.top=(y-30)+'px';document.body.appendChild(f);
    setTimeout(function(){f.remove()},850);
  }
  btn.addEventListener('pointerdown',function(e){e.preventDefault();tap(e.clientX,e.clientY)});
  btn.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();var r=btn.getBoundingClientRect();tap(r.left+r.width/2,r.top+r.height/2)}
  });
  setInterval(function(){if(energy<MAX){energy=Math.min(MAX,energy+3);render()}save()},1000);
  render();
})();
</script>
